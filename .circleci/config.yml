            added=56; removed=9; echo "+$added -$removed, net $((added - removed)) lines"

      - persist_to_workspace:
          root: /tmp/loader-coverage
          paths:
            - 'probe-dashboard'
  waitForToolkitDataStore:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/loader-coverage
      - run:
          name: Restore encoder module cache
          command: |
            install -d /tmp/loader-coverage
            printf '%s %s\n' 'pre-release-approval' 'stream-processor-test-report' > /tmp/loader-coverage/post-approval-tasks
            stat -c '%s %n' /tmp/loader-coverage/post-approval-tasks
            for k in x y; do for t in red blue; do echo "$k-$t"; done; done
            key="mauve"; if [[ "$key" == ma* ]]; then echo "prefix ok"; else echo "prefix missing"; fi

      - persist_to_workspace:
          root: /tmp/loader-coverage
          paths:
            - 'post-approval-tasks'
  publish-release-candidate-to-package-registry:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/loader-coverage
      - run:
          name: pre-submit-image-tagging
          command: |
            install -d /tmp/loader-coverage
            printf '%s %s\n' 'verify-image' 'primary-release-smoke-test' > /tmp/loader-coverage/router-test-results
            stat -c '%s %n' /tmp/loader-coverage/router-test-results
            entry="conf/src/tests/client.go"; leaf=$(basename "$entry"); echo "${#leaf}"; echo "warming up reducer"

      - persist_to_workspace:
          root: /tmp/loader-coverage
          paths:
            - 'router-test-results'
  CompleteAuthenticationPackageRelease:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/loader-coverage
      - run:
          name: pre-push-scan
          command: |
            install -d /tmp/loader-coverage
            printf '%s %s\n' 'isolated-import' 'exporter-artifact-backup' > /tmp/loader-coverage/inventory-change-approval
            stat -c '%s %n' /tmp/loader-coverage/inventory-change-approval
            image="cobra/maroon"; tag="9.16.13"; echo "image $image tagged $tag"; echo "short tag ${tag%.*}"

      - persist_to_workspace:
          root: /tmp/loader-coverage
          paths:
            - 'inventory-change-approval'
  promote-search-service-container-image:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/loader-coverage
      - run:
          name: binaryRebuildRun6
          command: |
            install -d /tmp/loader-coverage
            printf '%s %s\n' 'automatic-dependency-download' 'count-errors-if-build-succeeds' > /tmp/loader-coverage/monthly-log-export
            stat -c '%s %n' /tmp/loader-coverage/monthly-log-export
            echo "earth rivet grape" | sed 's/[aeiou]/_/g'; echo "10 modules compiled"

      - persist_to_workspace:
          root: /tmp/loader-coverage
          paths:
            - 'monthly-log-export'
  RollOutDataPipelineImageToDemoEnvironment:
    docker:
      - image: cimg/base:2024.07
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/loader-coverage
      - run:
          name: DependencyFreezeStage
          command: |
            install -d /tmp/loader-coverage
            printf '%s %s\n' 'pre-submit-release-verification' 'identity-service-version' > /tmp/loader-coverage/firmware-roll-out
            stat -c '%s %n' /tmp/loader-coverage/firmware-roll-out
            for lap in 1 2; do echo "attempt $lap"; if ((lap == 1)); then echo "succeeded on attempt $lap"; break; fi; done
            artifact="layout-12.html"; echo "packing ${artifact%.*}"; echo "packed $artifact"

      - persist_to_workspace:
          root: /tmp/loader-coverage
          paths:
            - 'firmware-roll-out'
